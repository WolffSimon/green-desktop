<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Green desktop</title>
<style>
  :root {
    --bg: #cfd1cb;
    --fg: #1d201b;
    --muted: #50564c;
    --bezel: #bdb8aa;
    --bezel-edge: #a39e90;
    --btn: rgba(29, 32, 27, 0.07);
    --btn-on: rgba(29, 32, 27, 0.15);
    --focus: #1d201b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141613; --fg: #dcdfd6; --muted: #9ba193;
      --bezel: #2c2d29; --bezel-edge: #3b3c37;
      --btn: rgba(220, 223, 214, 0.08); --btn-on: rgba(220, 223, 214, 0.17);
      --focus: #dcdfd6; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141613; --fg: #dcdfd6; --muted: #9ba193;
    --bezel: #2c2d29; --bezel-edge: #3b3c37;
    --btn: rgba(220, 223, 214, 0.08); --btn-on: rgba(220, 223, 214, 0.17);
    --focus: #dcdfd6; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: "Helvetica Neue", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .stage {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; padding: 16px;
  }
  .monitor {
    position: relative; border-radius: 10px; background: #000; line-height: 0; overflow: hidden;
    box-shadow: 0 0 0 10px var(--bezel), 0 0 0 11px var(--bezel-edge), 0 18px 44px rgba(0, 0, 0, 0.35);
  }
  .monitor.kbd {
    box-shadow: 0 0 0 10px var(--bezel), 0 0 0 13px var(--focus), 0 18px 44px rgba(0, 0, 0, 0.35);
  }
  #screen { display: block; cursor: none; touch-action: none; outline: none; }
  .scan {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2) 100%),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,0.3) 100%);
    background-size: 100% calc(100% / 200), 100% 100%;
    transition: opacity 0.2s;
  }
  .monitor.flat .scan { opacity: 0; }
  .foot {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 10px 18px; max-width: min(92vw, 760px);
    font-size: 0.9rem; line-height: 1.4; color: var(--muted); text-align: center;
  }
  .foot p { margin: 0; }
  .foot strong { color: var(--fg); font-weight: 600; }
  .toggles { display: flex; gap: 6px; }
  .toggles button {
    font: inherit; font-size: 0.85rem; color: var(--fg); background: var(--btn);
    border: 0; border-radius: 8px; padding: 6px 11px; cursor: pointer;
  }
  .toggles button[aria-pressed="true"] { background: var(--btn-on); }
  .toggles button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .scan { transition: none; } }
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="monitor" id="monitor">
    <canvas id="screen" tabindex="0" width="640" height="400"
      aria-label="A retro GEM-style desktop. Double-click Floppy disk A, then DEMO.EXE, to run a bouncing ball demo. With the screen focused, arrow keys select icons, Enter opens, Escape closes."></canvas>
    <div class="scan" aria-hidden="true"></div>
  </div>
  <footer class="foot" id="foot">
    <p>Double-click <strong>Floppy disk A</strong>, then <strong>DEMO.EXE</strong>. Menus drop down when you point at them.</p>
    <div class="toggles">
      <button id="sndBtn" aria-pressed="true">Sound on</button>
      <button id="scanBtn" aria-pressed="true">Scanlines on</button>
    </div>
  </footer>
</main>

function noclip() { cx0 = 0; cy0 = 0; cx1 = SW; cy1 = SH; }

      const i = y - 145, d = 600 / (i + 6), v = Math.floor((d + sz) / 8), shade = Math.pow(i / 31, 0.9);
      const A = c9(Math.round(1 * shade), Math.round(5 * shade), Math.round(6 * shade)), B = c9(0, Math.round(1 * shade), Math.round(2.4 * shade));
      const k = d / 160 / 8, row = y * 320;
      for (let x = 0; x < 320; x++) P[row + x] = ((Math.floor((x - 160) * k) + v) & 1) ? A : B;
    }
    P.fill(c9(3, 3, 4), 177 * 320, 178 * 320);
    P.fill(ST9[0], 178 * 320, 200 * 320);
    // dithered shadow
    const b = this.ball, R = this.R, hgt = this.FLOOR - (b.y + R), f = 1 - Math.min(1, hgt / 100);
    const rx = Math.round(R * (0.5 + 0.5 * f)), ry = 3, sx = Math.round(b.x), sy = this.FLOOR + 1;
    for (let yy = -ry; yy <= ry; yy++) for (let xx = -rx; xx <= rx; xx++) {
      if ((xx * xx) / (rx * rx) + (yy * yy) / (ry * ry) > 1) continue;
      const px = sx + xx, py = sy + yy;
      if (px >= 0 && px < 320 && ((px + py) & 1) === 0) P[py * 320 + px] = ST9[0];
    }
    this.drawBall();
    // sine scroller
    const L = SCROLL.length * 16, off = Math.floor(this.scroll) % L;
    for (let x = 0; x < 320; x++) {
      const col = (x + off) % L, ch = SCROLL.charCodeAt(col >> 4), bit = (col & 15) >> 1;
      const yo = Math.round(2 * Math.sin((x + t * 3) * 0.04)), c = RAINBOW[((x >> 2) + t) & 31];
      for (let r = 0; r < 8; r++) if ((FONT[ch * 8 + r] >> bit) & 1) { const y = 180 + yo + r * 2; P[y * 320 + x] = c; P[(y + 1) * 320 + x] = c; }
    }
  },
  logo(t) {
    const P = img32, s = "BOUNCE!", x0 = (320 - s.length * 32) >> 1, hl = ((t * 0.6) % 64) - 16;
    for (let pass = 0; pass < 2; pass++) {
      for (let r = 0; r < 32; r++) {
        const y = 8 + r + (pass ? 0 : 2), wob = Math.round(3 * Math.sin(t * 0.06 + r * 0.07)) + (pass ? 0 : 3);
        const col = pass ? (Math.abs(r - hl) < 2 ? c9(7, 7, 7) : c9(...LOGO[r])) : ST9[0];
        for (let i = 0; i < s.length; i++) {
          const bits = FONT[s.charCodeAt(i) * 8 + (r >> 2)]; if (!bits) continue;
          for (let bb = 0; bb < 8; bb++) if ((bits >> bb) & 1) {
            const px = x0 + i * 32 + bb * 4 + wob;
            for (let q = 0; q < 4; q++) { const xx = px + q; if (xx >= 0 && xx < 320) P[y * 320 + xx] = col; }
          }
        }
      }
    }
  },
  drawBall() {
    const b = this.ball, R = this.R, P = img32, cx = Math.round(b.x), cy = Math.round(b.y);
    const ca = Math.cos(-0.35), sa = Math.sin(-0.35), [lx, ly, lz] = LIGHT, lim = R * R + R * 0.6;
    for (let dy = -R; dy <= R; dy++) {
      const py = cy + dy; if (py < 0 || py >= 200) continue;
      for (let dx = -R; dx <= R; dx++) {
        if (dx * dx + dy * dy > lim) continue;
        const px = cx + dx; if (px < 0 || px >= 320) continue;
        const nx = dx / R, ny = dy / R, nz2 = 1 - nx * nx - ny * ny, nz = nz2 > 0 ? Math.sqrt(nz2) : 0;
        const tx = nx * ca - ny * sa, ty = nx * sa + ny * ca;
        let col;
        if (Math.abs(ty) > 0.86) col = CAP;
        else { let fr = ((Math.atan2(tx, nz) + b.rot) / TAU) % 1; if (fr < 0) fr += 1; col = SEG[(fr * 6) | 0]; }
        const lam = Math.max(0, nx * lx + ny * ly + nz * lz), inten = 0.22 + 0.85 * lam, spec = Math.pow(lam, 28) * 6;
        const th = BAYER[((py & 3) << 2) | (px & 3)];
        P[py * 320 + px] = ST9[Math.min(7, Math.floor(col[0] * inten + spec + th)) * 64 +
          Math.min(7, Math.floor(col[1] * inten + spec + th)) * 8 + Math.min(7, Math.floor(col[2] * inten + spec + th))];
      }
    }
  },
};

/* ======================= Events, sizing, loop ======================= */
function toLogical(e) {
  const r = screenEl.getBoundingClientRect();
  mx = clamp(Math.floor((e.clientX - r.left) / r.width * SW), 0, SW - 1);
  my = clamp(Math.floor((e.clientY - r.top) / r.height * SH), 0, SH - 1);
}
screenEl.addEventListener("pointerdown", e => {
  e.preventDefault(); screenEl.focus({ preventScroll: true });
  try { screenEl.setPointerCapture(e.pointerId); } catch (_) {}
  pointerIn = true; toLogical(e);
  if (mode === "demo") { Demo.stop(); return; }
  if (mode === "text") { mode = "desk"; return; }
  onDown(e.shiftKey);
});
screenEl.addEventListener("pointermove", e => { toLogical(e); pointerIn = true; if (mode === "desk") onMove(); });
screenEl.addEventListener("pointerup", e => { toLogical(e); if (mode === "desk") onUp(); });
screenEl.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") pointerIn = false; });
screenEl.addEventListener("pointercancel", () => { drag = null; if (dialog) dialog.pressed = null; });
screenEl.addEventListener("contextmenu", e => e.preventDefault());

const stage = document.getElementById("stage"), foot = document.getElementById("foot"), monitor = document.getElementById("monitor");
const scanBtn = document.getElementById("scanBtn");
let kbdNav = false;
window.addEventListener("keydown", e => { if (e.key === "Tab") kbdNav = true; }, true);
window.addEventListener("pointerdown", () => { kbdNav = false; }, true);
screenEl.addEventListener("focus", () => monitor.classList.toggle("kbd", kbdNav));
screenEl.addEventListener("blur", () => monitor.classList.remove("kbd"));
let scanChosen = false;
function setScan(on) { monitor.classList.toggle("flat", !on); scanBtn.textContent = on ? "Scanlines on" : "Scanlines off"; scanBtn.setAttribute("aria-pressed", String(on)); }
scanBtn.addEventListener("click", () => { scanChosen = true; setScan(monitor.classList.contains("flat")); });
function fit() {
  const availW = stage.clientWidth - 32 - 24, availH = stage.clientHeight - 32 - foot.offsetHeight - 22 - 24;
  const cssW = Math.max(200, Math.min(availW, availH * 1.6));
  const dpr = window.devicePixelRatio || 1;
  let devW = Math.round(cssW * dpr);
  const k = devW / 640;
  if (k >= 1 && Math.floor(k) / k >= 0.8) devW = Math.floor(k) * 640;
  const devH = Math.round(devW * 10 / 16);
  screenEl.width = devW; screenEl.height = devH;
  screenEl.style.width = devW / dpr + "px"; screenEl.style.height = devH / dpr + "px";
  if (!scanChosen) setScan(devH / dpr / 200 >= 2.2);
}
window.addEventListener("resize", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);

function frame(now) {
  if (mode === "desk") {
    if (drag && drag.kind === "repeat" && now >= drag.next && (!drag.btn || inR(drag.btn))) { drag.fn(); drag.next = now + 70; }
    renderDesk(now); presentIndexed();
  } else if (mode === "text") {
    renderText(); presentIndexed();
  } else {
    Demo.update(now); Demo.render(); blit();
  }
  requestAnimationFrame(frame);
}

setRes(640, 200);
loadDesktop();
updatePal();
fit();
requestAnimationFrame(frame);
})();
</script>
